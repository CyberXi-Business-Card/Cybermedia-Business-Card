<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile</title>
<style>
:root{--blue:#3333ff;--ink:#151515;--lime:#c6ff33;--purple:#7b3aed;--bg:#eceef5}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;justify-content:center;background:var(--bg);font-family:"Outfit","Segoe UI",Tahoma,sans-serif;color:var(--ink)}
.card{width:100%;max-width:440px;background:#fff;display:flex;flex-direction:column;overflow:hidden;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.brand{text-align:center;padding:36px 0 22px}
.logo{width:190px;max-width:60%}
.rule{display:flex;align-items:center;margin:26px 0}
.rule i{width:41%;height:26px;background:var(--blue)}
.rule b{flex:1;height:4px;background:var(--ink)}
.rule.bottom{margin:22px 0 0}
.rule.bottom b{flex:0 0 70%}
.rule.bottom a{padding:0 14px;color:var(--ink);text-decoration:none;font-size:.95rem;white-space:nowrap}
.info{padding:6px 9%}
h2{font-size:2rem;line-height:1.1}
.info p{margin:8px 0 22px;font-size:1.05rem}
.row{display:flex;align-items:center;gap:14px;margin-bottom:12px;color:inherit;text-decoration:none;font-size:1.3rem}
.ico{width:34px;height:34px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.1rem;flex:none}
.row:hover span{color:var(--blue)}
.actions{display:flex;gap:10px;padding:20px 9%}
button{flex:1;padding:13px;border:2px solid var(--blue);background:var(--blue);color:#fff;font:600 1rem inherit;cursor:pointer;transition:.2s}
button.alt{background:#fff;color:var(--blue)}
button:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.pattern{display:grid;grid-template-columns:repeat(4,1fr)}
.t{aspect-ratio:1;display:grid;place-items:center}
.blue{background:var(--blue)}.black{background:var(--ink)}.lime{background:var(--lime)}.purple{background:var(--purple)}
.t s{display:block}
.bar{width:50%;height:9%;background:#fff}
.eye{width:80%;height:58%;background:var(--blue);clip-path:polygon(0 50%,25% 12%,50% 0,75% 12%,100% 50%,75% 88%,50% 100%,25% 88%);position:relative}
.eye::after{content:"";position:absolute;inset:20% 33%;background:#fff;border-radius:50%}
.key{width:46%;height:72%;background:radial-gradient(circle at 50% 32%,#fff 0 39%,transparent 40%),linear-gradient(#fff,#fff) 50% 100%/38% 52% no-repeat}
.half{width:56%;height:52%;background:radial-gradient(circle at 100% 50%,var(--ink) 0 99%,transparent) left/50% 100% no-repeat,radial-gradient(circle at 0 50%,var(--ink) 0 99%,transparent) right/50% 100% no-repeat}
.nf{margin:auto;font-size:1.2rem}
</style>
</head>

<p id="notfound" class="nf" hidden>Profile not found.</p>
<script>
// Employee directory — add entries keyed by ?id=
const EMPLOYEES = {
  "8591247630": {
    name: "Lolwah Alnafea",
    title: "Cybersecurity Awareness Program Manager",
    phone: "+966530196755",
    email: "l.alnafea@cyberx.sa",
    web: "www.cyberx.sa"
  }
};

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");
const e = EMPLOYEES[id];

if (!e) {
  $("notfound").hidden = false;
} else {
  document.title = `${e.name} | CyberMedia`;
  $("name").textContent = e.name;
  $("title").textContent = e.title;
  $("phone").href = `tel:${e.phone}`;
  $("phone").lastElementChild.textContent = e.phone.replace(/^(\+966)(\d{2})(\d{3})(\d{2})(\d{2})$/, "$1 $2 $3 $4 $5");
  $("email").href = `mailto:${e.email}`;
  $("email").lastElementChild.textContent = e.email;
  $("web").href = `https://${e.web}`;
  $("web").textContent = e.web;
  $("card").hidden = false;

  $("save").onclick = () => {
    const [first, ...rest] = e.name.split(" ");
    const vcf = ["BEGIN:VCARD","VERSION:3.0",`N:${rest.join(" ")};${first};;;`,`FN:${e.name}`,
      "ORG:CyberMedia by CyberXi",`TITLE:${e.title}`,`TEL;TYPE=CELL:${e.phone}`,
      `EMAIL;TYPE=WORK:${e.email}`,`URL:https://${e.web}`,"END:VCARD"].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([vcf], { type: "text/vcard" }));
    a.download = `${e.email.split("@")[0]}.vcf`;
    a.click();
  };

  $("share").onclick = async () => {
    const data = { title: e.name, text: `${e.name} — ${e.title}`, url: location.href };
    try { navigator.share ? await navigator.share(data) : await navigator.clipboard.writeText(location.href); } catch {}
  };
}
</script>
